# PostgreSQL via Dev Services (Testcontainers); não há URL explícita de propósito.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# Porta HTTP de teste aleatória (não colide com o quarkus:dev na 8080)
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

# JWT de teste (chaves descartáveis)
mp.jwt.verify.publickey.location=chaves/publicKey-teste.pem
mp.jwt.verify.issuer=techparterns-teste
smallrye.jwt.sign.key.location=chaves/privateKey-teste.pem

# IP do cliente por X-Forwarded-For (só no teste)
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=127.0.0.1,::1,localhost

quarkus.mailer.mock=true
crm.bcrypt-cost=4
crm.mail.retry-delays=PT0.05S,PT0.1S
crm.owner.email=
crm.owner.nome=
