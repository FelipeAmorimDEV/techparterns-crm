quarkus.hibernate-orm.database.generation=none
quarkus.http.limits.max-body-size=12M

quarkus.datasource.db-kind=postgresql
# Datasource explícito apenas em dev e prod. No perfil de teste os Dev Services
# sobem um PostgreSQL descartável (Testcontainers) e não tocam no banco local.
%dev.quarkus.datasource.username=${DB_USER:crm}
%dev.quarkus.datasource.password=${DB_PASSWORD:crm}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/crm}
%prod.quarkus.datasource.username=${DB_USER:crm}
%prod.quarkus.datasource.password=${DB_PASSWORD:crm}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/crm}
%cli.quarkus.datasource.username=${DB_USER:crm}
%cli.quarkus.datasource.password=${DB_PASSWORD:crm}
%cli.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/crm}
%cli.quarkus.devservices.enabled=false
%dev.quarkus.devservices.enabled=false
%prod.quarkus.devservices.enabled=false
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

quarkus.flyway.migrate-at-start=true

# JWT (somente dev): chaves locais em dev-keys/ e endpoint GET /dev/token
%dev.mp.jwt.verify.publickey.location=file:dev-keys/publicKey.pem
%dev.mp.jwt.verify.issuer=techparterns-dev
%dev.smallrye.jwt.sign.key.location=file:dev-keys/privateKey.pem
# Perfil cli (comando do dono): mesmas chaves de dev, só para a aplicação subir
%cli.mp.jwt.verify.publickey.location=file:dev-keys/publicKey.pem
%cli.mp.jwt.verify.issuer=techparterns-dev
%cli.smallrye.jwt.sign.key.location=file:dev-keys/privateKey.pem

# JWT de produção: chaves e emissor SEMPRE por variável de ambiente (sem valor padrão)
%prod.mp.jwt.verify.publickey.location=${CRM_JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${CRM_JWT_PRIVATE_KEY_LOCATION}
%prod.mp.jwt.verify.issuer=${CRM_JWT_ISSUER}

# SMTP (produção): host, porta, usuário e senha por variáveis de ambiente
%prod.quarkus.mailer.host=${CRM_SMTP_HOST}
%prod.quarkus.mailer.port=${CRM_SMTP_PORT:587}
%prod.quarkus.mailer.username=${CRM_SMTP_USER:}
%prod.quarkus.mailer.password=${CRM_SMTP_PASSWORD:}
%prod.quarkus.mailer.start-tls=REQUIRED
# SMTP (dev): Mailpit do docker-compose; caixa de entrada em http://localhost:8025
%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.host=${CRM_SMTP_HOST:localhost}
%dev.quarkus.mailer.port=${CRM_SMTP_PORT:1025}
quarkus.mailer.from=${CRM_MAIL_REMETENTE:no-reply@techpartners.local}

# CORS com origem explícita
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CRM_ALLOWED_ORIGINS:http://localhost:4200}
quarkus.http.cors.access-control-allow-credentials=true

# IP do cliente atrás de proxy (DTP-5): desligado por padrão
quarkus.http.proxy.proxy-address-forwarding=${CRM_PROXY_FORWARDING:false}
quarkus.http.proxy.trusted-proxies=${CRM_TRUSTED_PROXIES:127.0.0.1}

# Configuração do módulo de identidade
crm.frontend-url=${CRM_FRONTEND_URL:http://localhost:4200}
crm.cookie.secure=true
crm.allowed-origins=${CRM_ALLOWED_ORIGINS:http://localhost:4200}
crm.owner.email=${CRM_OWNER_EMAIL:}
crm.owner.nome=${CRM_OWNER_NOME:}

# Perfil cli (comando de senha do dono): sem HTTP e sem semente
%cli.quarkus.http.host-enabled=false
%cli.crm.owner.semear=false
